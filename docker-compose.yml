services:
  # Aplicación Laravel (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: his-laravel-app:latest
    container_name: his_laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-his_hospital}
      - DB_USERNAME=${DB_USERNAME:-his_user}
      - DB_PASSWORD=${DB_PASSWORD:-his_password}
    networks:
      - his_network
    depends_on:
      db:
        condition: service_healthy

  # Servidor Web Nginx
  webserver:
    image: nginx:alpine
    container_name: his_nginx_webserver
    restart: unless-stopped
    ports:
      - "${FORWARD_NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - his_network
    depends_on:
      - app

  # Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: his_mysql_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-his_hospital}
      MYSQL_USER: ${DB_USERNAME:-his_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-his_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - his_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - his_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  his_network:
    driver: bridge

volumes:
  his_mysql_data:
    driver: local
